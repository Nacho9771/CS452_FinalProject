[project]
name = "cs-452-finalproject"
version = "0.1.0"
description = "My Kitchen mobile app backend"
readme = "README.md"
authors = [
    { name = "Nacho9771", email = "cgordon0@byu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "firebase-admin>=7,<8",
    "pymongo>=4.11,<5",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[project.scripts]
cs-452-finalproject = "cs_452_finalproject:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
